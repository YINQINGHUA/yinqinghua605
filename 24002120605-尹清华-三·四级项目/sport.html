<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keep-运动</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="yin_wrap">
  <!--顶部图标-->
  <div class="yin_sport_top_icon">
    <span class="yin_icon_watch">⌚</span>
    <span class="yin_icon_set">⚙</span>
    <span class="yin_icon_coach">🧞</span>
  </div>
  <!--地图区域-->
  <div class="yin_map_area_real">
    <div class="yin_map_bg_real"></div>
    <div class="yin_map_right_icon">
      <div>GPS</div>
      <div>👥组队</div>
      <div>〰路线</div>
    </div>
    <div class="yin_location_text">
      <span class="yin_loc_icon">📍</span>
      <h2>开启位置权限 ></h2>
      <p>Keep访问你的位置信息，用于记录你的户外跑步、行走、骑行等运动数据，提供身边的运动内容推荐</p>
    </div>
  </div>
  <!--跑步模式切换-->
  <div class="yin_run_mode">
    <div class="yin_run_mode_item">目标跑</div>
    <div class="yin_run_mode_item active">自由跑</div>
    <div class="yin_run_mode_item">课程跑</div>
    <div class="yin_run_mode_item">自定义</div>
  </div>
  <!--运动类型选择-->
  <div class="yin_sport_type">
    <div class="yin_type_left">更多运动</div>
    <div class="yin_type_item active">
      <div class="yin_type_icon">🏃</div>
      <div>户外跑步</div>
    </div>
    <div class="yin_type_item">
      <div class="yin_type_icon">🚶</div>
      <div>户外行走</div>
    </div>
    <div class="yin_type_item">
      <div class="yin_type_icon">🪀</div>
      <div>跳绳</div>
    </div>
  </div>
  <!--陪跑模式-->
  <div class="yin_peipao_bar">
    <span>陪跑模式</span>
    <span>语音轻松跑·自由版</span>
    <span class="yin_tag_limit">限免体验 ></span>
  </div>
  <!--底部GO按钮区域-->
  <div class="yin_go_bottom_area">
    <div class="yin_go_left">🎵 音乐</div>
    <button class="yin_go_big_btn">GO</button>
    <div class="yin_go_right">🖋 装备</div>
  </div>
  <div class="yin_bottom_space"></div>
</div>

<!--底部导航-->
<nav class="yin_tab">
  <a href="category.html" class="yin_tab_item">
    <span class="yin_tab_icon">📖</span>
    <span>课程</span>
  </a>
  <a href="index.html" class="yin_tab_item">
    <span class="yin_tab_icon">🗓</span>
    <span>日程</span>
  </a>
  <a href="sport.html" class="yin_tab_item active">
    <span class="yin_tab_icon">🏃</span>
    <span>运动</span>
  </a>
  <a href="discover.html" class="yin_tab_item">
    <span class="yin_tab_icon">🌐</span>
    <span>发现</span>
  </a>
  <a href="mine.html" class="yin_tab_item">
    <span class="yin_tab_icon">👤</span>
    <span>我的</span>
  </a>
</nav>
</body>
</html>
