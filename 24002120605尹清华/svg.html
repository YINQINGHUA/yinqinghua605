<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="https://at.alicdn.com/t/c/font_5235509_srb241aw1li.js"></script>
    <link rel="stylesheet" href="./css/svg.css">
    <style>
</style>
</head>
<body>
   <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-shouye"></use>
            </svg>
              <span>首页</span>
              <!--div.budge-dot回车-->
            <div class="budge-dot" id="budge-home"></div>
        </div>
         <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-wode"></use>
            </svg>
              <span>我的</span>
              <!--div.budge-num数字红点-->
              <div class="budge-num" id="budge-plan">6</div>
        </div>
         <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-gouwuche"></use>
            </svg>
              <span>购物车</span>
                <!--div.budge-dot max数字红点-->
                <div class="budge-dot max" id="budge-collect"></div>
        </div>
         <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-shoucang"></use>
            </svg>
              <span>收藏</span>
              <!--div.budge-border数字红点-->
                <div class="budge-border">
        100+</div>
    </div>
    <script>
        // 写一个函数，当我点击当天的item时候，颜色发生变化
        function changeTab(current){
            let tabs=document.querySelectorAll('.tab-item');
            for(let i=0;i<tabs.length;i++){
                tabs[i].classList.remove('active');
            }
        //2.给当前点击的加上active高亮
        current.classList.add('active');
        }
    </script>
</body>
</html>
