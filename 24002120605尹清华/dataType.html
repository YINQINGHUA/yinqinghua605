<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型与运算符</title>
</head>
    <style>
    div{
        width: 180px;
        height: 180px;
        background-color: red;
        display: inline-block;  
        margin: 10px;
        color: white;
        text-align: center;
        line-height: 180px;
        font-size: 100px;
        float: left;
    }
    </style>
<body>
    <script>    
    var a = 6; // 整数类型
    var b = 1;
    console.log( a + b); // 输出: a + b = 7
    console.log(a++,++b); // 输出: 6 2
    console.log(a-b>0?a:b);
    console.log(true&&false,true||false,!true);
    var str="hello world",num=123,bl=true,obj={name:"张三",age:18},ud,kong=null;
    console.log(typeof str,typeof num,typeof bl,typeof obj,typeof ud,typeof kong);
    console.log(0.1+0.2==0.3);
    // JS不能用==或者=== 来判定浮点数是否相等，
    //应为浮点数在计算机中是以二进制形式存储的，某些小数无法精确表示，导致计算结果可能存在微小误差。
    //数据类型转换：+号的时候将数字 转换成字符串，-号的时候将字符串转换成数字
    console.log(1+"1","1"-1,"11"+1-1); //11,0,110
    console.log("wang"-1);//NaN: not a number,它与任何数比较都是false，包括它自己
    console.log(isNaN(8)); // false
    console.log(isNaN(NaN));
    console.log(NaN==NaN,null==null);
    //isNaN()函数用来判断一个值是否为NaN，如果是NaN则返回true，否则返回false。
    //parseInt()函数用于将字符串解析为整数，向下取整，parseFloat()函数用于将字符串解析为浮点数。
    console.log(parseInt("123abc"),parseFloat("123.45abc"));
    //如果想判断一个数值是不是整数的方法有什么
    var num = 10;
    console.log(num==parseInt(num)); // true
    //parseInt()函数第二个参数是进制数
    console.log(parseInt("100",16)); // 256
    //1-100求和
     var sum=0;
     for(var i=1;i<=100;i++){
        sum+=i;
     }
    //数7，（7的倍速，最大到99，个位是7，或者十位是7，不显示数字）
    for(var i=1;i<100;i++){
        if(i%7==0||i%10==7||parseInt(i/10)==7){
            document.write("<div></div>");
        }
        else{
            document.write("<div>"+i+"</div>");
        }
    }    
    //课后练习：回文数显示11,22（1-99







    </script>
</body>
</html>
