<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //math对象
        console.log(Math.floor(8.7)); //向下取整 8
        console.log(Math.ceil(8.7)); //向上取整 9    
        console.log(Math.round(8.7)); //四舍五入 9    
        console.log(Math.random()); //生成0到1之间的随机数
        //获取从min到max之间的随机整数
        function getRandomInt(min, max) {
            min = Math.ceil(min);
            max = Math.floor(max);
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        console.log(getRandomInt(100, 900)); //生成100到900之间的随机整数
        //date对象
        var now = new Date();
        console.log(now.getFullYear()); //获取年份
        console.log(now.getMonth() + 1); //获取月份 (0-11，所以要加1)
        console.log(now.getDate()); //获取日期
        console.log(now.getDay()); //获取星期 (0-6，0表示星期日)
        console.log(now.getHours()+":"+now.getMinutes()+":"+now.getSeconds()); //获取小时、分钟、秒数
        console.log(now.getTime()); //获取自1970年1月1日00:00:00 UTC以来的毫秒数
        console.log(now.toLocaleString()); //获取本地时间字符串
       
        //数组对象
        var arr = [1, 2, 3, 4, 'five','six','seven'];
        var arr1 = new Array(1, 2, 3, 4, 'five','six','seven'); 
        console.log(arr);
        console.log(arr1);
        console.log(new Array(5)); //创建一个包含5个空元素的数组
        var arr2 = Array.of(5); //创建一个包含单个元素5的数组
        console.log(arr2);









        
    </script>
</body>
</html>
